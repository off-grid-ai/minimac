<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="/assets/brand/minimac-mark.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minimac</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" />
<link rel="stylesheet" href="https://ka-f.webawesome.com/3.12.0/styles/themes/default.css" />
<script type="module" src="https://ka-f.webawesome.com/3.12.0/webawesome.loader.js"></script>
<style>
  /* ---------------------------------------------------------------- tokens
     Every colour is named here, in the bare :root, so no token exists only
     inside a media query. The dark palette overrides the same names twice:
     once for the system preference, once for an explicit choice. */

  :root {
    --bg: #ffffff;
    --surface: #f4f4f4;
    --nested: #eaeaea;
    --sunk: #dedede;
    --line: #c9c9c9;
    --line-soft: #dfdfdf;
    --text: #0d0d0d;
    --muted: #4f4f4f;
    --faint: #7c7c7c;
    --accent: #059669;
    --accent-ink: #ffffff;
    --accent-soft: rgba(5, 150, 105, 0.12);
    --accent-edge: rgba(5, 150, 105, 0.55);
    --accent-glow: rgba(5, 150, 105, 0.38);
    --danger: #c81e1e;
    --danger-soft: rgba(200, 30, 30, 0.12);
    --danger-edge: rgba(200, 30, 30, 0.50);
    --floor-bg: #101010;

    /* Instrument glass: the room must stay faintly readable underneath. */
    --glass: rgba(244, 244, 244, 0.82);
    --glass-solid: rgba(244, 244, 244, 0.94);

    --mono: Menlo, "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    --pixel: Silkscreen, Menlo, monospace;
    --step: 4px;
    --radius: 2px;
    --topbar-h: 48px;
    --crew-h: 40px;
    /* The console's live height. ui/main.mjs writes the measured value here
       after autosizing, so the bottom slots ride up as the console grows.
       Left alone it keeps the one-line height. */
    --composer-h: 92px;
    --gap: 10px;

    /* Web Awesome is the control layer. MINIMAC tokens remain the visual SSOT. */
    --wa-font-family-body: var(--mono);
    --wa-font-family-heading: var(--mono);
    --wa-color-brand-fill-loud: var(--accent);
    --wa-color-brand-on-loud: var(--accent-ink);
    --wa-color-surface-default: var(--surface);
    --wa-color-surface-raised: var(--nested);
    --wa-color-text-normal: var(--text);
    --wa-color-text-quiet: var(--muted);
    --wa-border-radius-s: var(--radius);
    --wa-border-radius-m: var(--radius);

  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0a0a;
      --surface: #101010;
      --nested: #161616;
      --sunk: #1e1e1e;
      --line: #303030;
      --line-soft: #202020;
      --text: #eaeaea;
      --muted: #9a9a9a;
      --faint: #6e6e6e;
      --accent: #34d399;
      --accent-ink: #04120c;
      --accent-soft: rgba(52, 211, 153, 0.14);
      --accent-edge: rgba(52, 211, 153, 0.55);
      --accent-glow: rgba(52, 211, 153, 0.45);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --danger-edge: rgba(248, 113, 113, 0.52);
      --floor-bg: #101010;
      --glass: rgba(12, 12, 12, 0.80);
      --glass-solid: rgba(12, 12, 12, 0.93);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0a0a0a;
    --surface: #101010;
    --nested: #161616;
    --sunk: #1e1e1e;
    --line: #303030;
    --line-soft: #202020;
    --text: #eaeaea;
    --muted: #9a9a9a;
    --faint: #6e6e6e;
    --accent: #34d399;
    --accent-ink: #04120c;
    --accent-soft: rgba(52, 211, 153, 0.14);
    --accent-edge: rgba(52, 211, 153, 0.55);
    --accent-glow: rgba(52, 211, 153, 0.45);
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, 0.14);
    --danger-edge: rgba(248, 113, 113, 0.52);
    --floor-bg: #101010;
    --glass: rgba(12, 12, 12, 0.80);
    --glass-solid: rgba(12, 12, 12, 0.93);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }

  /* ----------------------------------------------------------------- shell
     The room IS the interface. Nothing sits in normal flow: the canvas fills
     the viewport and every panel is an instrument floating over it. */

  body {
    margin: 0;
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--floor-bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.45;
    font-variant-ligatures: none;
  }

  /* Always on, never moving: who is working and what they are doing. */
  .crewbar {
    position: fixed;
    top: var(--topbar-h);
    left: 0;
    right: var(--panel-w, 0px);
    height: var(--crew-h);
    z-index: 30;
    display: flex;
    gap: 1px;
    box-sizing: border-box;
    background: var(--line);
    border-bottom: 1px solid var(--line);
  }
  .crewcell {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
    padding: 5px 8px; cursor: pointer; text-align: left;
    background: var(--surface); border: 0; border-top: 2px solid transparent;
    font: inherit; color: inherit;
  }
  .crewcell:hover { background: var(--sunk); }
  .crewcell[data-focus="yes"] { background: var(--sunk); }
  .crewcell-name {
    font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .crewcell-doing {
    font-size: 10px; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  /* Working reads bright; idle reads dead. The delta has to carry across the room. */
  .crewcell[data-state="on"] { border-top-color: var(--accent); }
  .crewcell[data-state="on"] .crewcell-name { color: var(--accent); }
  .crewcell[data-state="on"] .crewcell-doing { color: var(--text); }
  .crewcell[data-state="blocked"] { border-top-color: var(--danger); }
  .crewcell[data-state="blocked"] .crewcell-name { color: var(--danger); }
  .crewcell[data-state="blocked"] .crewcell-doing { color: var(--danger); }
  .crewcell[data-state="idle"] .crewcell-name { color: var(--muted); }
  .crewcell[data-state="off"] { opacity: .38; }

  #floor {
    position: fixed;
    left: 0;
    /* The crew bar takes real height, exactly as the panel takes real width.
       Floating it over the room clipped every bubble behind it. */
    top: calc(var(--topbar-h) + var(--crew-h));
    height: calc(100vh - var(--topbar-h) - var(--crew-h));
    /* The panel COEXISTS with the room, it does not sit on top of it. The
       canvas gives up exactly the panel's width, so opening a panel never
       hides an agent - it makes the room narrower and the camera pulls back
       to keep the whole crew in frame. */
    width: calc(100vw - var(--panel-w, 0px));
    display: block;
    background: var(--floor-bg);
    image-rendering: pixelated;
  }

  :focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 8px -1px var(--accent-glow); }
  ::selection { background: var(--accent-soft); }
  [hidden] { display: none !important; }

  /* ------------------------------------------------------------ hud frame
     A drawn frame, not a box: hairline edge plus corner brackets. One
     element, eight gradient strips, no extra markup per corner. */

  .hud-frame {
    position: absolute;
    inset: 0;
    pointer-events: none;
    --bracket: 11px;
    --hair: 1px;
    background:
      linear-gradient(var(--frame-ink), var(--frame-ink)) 0 0 / var(--bracket) var(--hair) no-repeat,
      linear-gradient(var(--frame-ink), var(--frame-ink)) 0 0 / var(--hair) var(--bracket) no-repeat,
      linear-gradient(var(--frame-ink), var(--frame-ink)) 100% 0 / var(--bracket) var(--hair) no-repeat,
      linear-gradient(var(--frame-ink), var(--frame-ink)) 100% 0 / var(--hair) var(--bracket) no-repeat,
      linear-gradient(var(--frame-ink), var(--frame-ink)) 0 100% / var(--bracket) var(--hair) no-repeat,
      linear-gradient(var(--frame-ink), var(--frame-ink)) 0 100% / var(--hair) var(--bracket) no-repeat,
      linear-gradient(var(--frame-ink), var(--frame-ink)) 100% 100% / var(--bracket) var(--hair) no-repeat,
      linear-gradient(var(--frame-ink), var(--frame-ink)) 100% 100% / var(--hair) var(--bracket) no-repeat;
    --frame-ink: var(--muted);
    transition: filter 160ms ease-out;
  }

  /* The accent glows on the instrument that is wired to the selected agent,
     and on whatever the keyboard is inside. Never on more than that. */
  .win[data-wired="true"] > .hud-frame,
  .win:focus-within > .hud-frame,
  #composer:focus-within > .hud-frame {
    --frame-ink: var(--accent);
    filter: drop-shadow(0 0 3px var(--accent-glow));
  }

  /* ---------------------------------------------------------------- topbar */

  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-h);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: calc(var(--step) * 4);
    padding: 0 calc(var(--step) * 3);
    background: var(--glass);
    backdrop-filter: blur(8px) saturate(1.1);
    border-bottom: 1px solid var(--line);
  }

  .brand {
    font-family: var(--pixel);
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--accent);
    flex: 0 0 auto;
    text-shadow: 0 0 10px var(--accent-glow);
  }

  #repoPath {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 0;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    padding: 2px 6px;
    max-width: 34vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
    flex: 0 0 auto;
    transition: color 140ms ease-out, border-color 140ms ease-out;
  }

  #repoPath::before { content: "◈ "; color: var(--faint); }
  #repoPath:hover { color: var(--text); border-color: var(--line); }

  /* The only standing instruction on screen. The room teaches the rest. */
  .hint {
    flex: 1 1 auto;
    min-width: 0;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #clock {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    flex: 0 0 auto;
  }

  /* --------------------------------------------------------------- buttons */

  .btn {
    position: relative;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0;
    color: var(--text);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.12em;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 140ms ease-out, background-color 140ms ease-out, color 140ms ease-out, transform 120ms ease-out;
  }

  .btn:hover { border-color: var(--accent-edge); }
  .btn:active { transform: translateY(1px); }

  .btn.primary {
    border-color: var(--accent-edge);
    background: var(--accent-soft);
    color: var(--accent);
    box-shadow: 0 0 10px -3px var(--accent-glow);
  }

  .btn.primary:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* The counterpart to START ALL. Outlined, not filled: a solid red button
     would compete with the genuine failure signals in the room. */
  .btn.stop {
    border-color: var(--danger-edge);
    color: var(--danger);
  }

  .btn.stop:hover { background: var(--danger); border-color: var(--danger); color: var(--bg); }

  .btn.stop[disabled] {
    border-color: var(--line);
    color: var(--faint);
    cursor: default;
    opacity: 0.55;
  }

  .btn.stop[disabled]:hover { background: transparent; color: var(--faint); border-color: var(--line); }

  /* A boolean is a switch, never a button that says ON. Same shape as the
     per-agent switch in the crew row, so one gesture means one thing. */
  .switch-cell { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .switch-icon { color: var(--faint); font-size: 13px; line-height: 1; }
  .switch[aria-checked="true"] + .switch-icon,
  .switch-cell:has(.switch[aria-checked="true"]) .switch-icon { color: var(--accent); }

  .switch {
    position: relative;
    box-sizing: border-box;
    width: 26px;
    height: 14px;
    min-width: 26px;
    padding: 0;
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: transparent;
    cursor: pointer;
    transition: background-color 120ms ease-out, border-color 120ms ease-out;
  }

  .switch > i {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: left 120ms ease-out, background-color 120ms ease-out;
  }

  .switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked="true"] > i { left: 14px; background: var(--bg); }

  .icon-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 0;
    color: var(--faint);
    font: inherit;
    font-size: 11px;
    line-height: 1;
    padding: 3px 5px;
    cursor: pointer;
    transition: color 140ms ease-out, border-color 140ms ease-out;
  }

  .icon-btn:hover { color: var(--text); border-color: var(--line); }

  /* ------------------------------------------------------------ world layer
     Cards pinned to a desk. ui/scene.mjs projects each head into viewport
     pixels because this fixed plane covers the viewport, not only the canvas. */

  #bubbles {
    position: fixed;
    inset: 0;
    z-index: 26;
    pointer-events: none;
  }

  .bubble {
    pointer-events: auto;
    position: absolute;
    width: 260px;
    padding: calc(var(--step) * 1.75) calc(var(--step) * 2);
    background: var(--glass-solid);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-left: 2px solid var(--accent);
    color: var(--text);
    font-size: 11px;
    line-height: 1.4;
    cursor: pointer;
    transform: translate(-50%, calc(-100% - 12px));
    transition: border-color 140ms ease-out;
  }

  .bubble:hover { border-color: var(--accent-edge); }
  .bubble.loop, .bubble.silent, .bubble.blocked, .bubble.overrun { border-left-color: var(--danger); }
  .bubble.approval { border-left-color: var(--accent); }

  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -5px;
    width: 9px;
    height: 9px;
    margin-left: -5px;
    transform: rotate(45deg);
    background: var(--glass-solid);
    border-right: 1px solid var(--accent);
    border-bottom: 1px solid var(--accent);
  }

  .bubble.loop::after, .bubble.silent::after, .bubble.blocked::after, .bubble.overrun::after,
  .bubble:has(.decision.loop)::after,
  .bubble:has(.decision.silent)::after,
  .bubble:has(.decision.blocked)::after {
    border-right-color: var(--danger);
    border-bottom-color: var(--danger);
  }

  .bubble[data-tail="top"] { transform: translate(-50%, 12px); }

  .bubble[data-tail="top"]::after {
    bottom: auto;
    top: -5px;
    border: 0;
    border-left: 1px solid var(--accent);
    border-top: 1px solid var(--accent);
  }

  .bubble:has(.decision) { padding: 0; background: transparent; border: 0; backdrop-filter: none; }

  /* ------------------------------------------------------------ instruments
     Small HUD windows floating over the room. Where they sit is ui/windows.
     mjs's business - perimeter slots, dragging and resizing - so everything
     below is how they look, never where they are. */

  #windows { display: contents; }

  /* ui/windows.mjs owns every window's geometry - slot, drag and resize are
     written as inline styles - so nothing here sets position, size or edge
     offsets. This block is appearance only. */
  .win {
    pointer-events: auto;
    position: fixed;
    z-index: 30;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--glass);
    backdrop-filter: blur(10px) saturate(1.1);
    border: 1px solid var(--line);
    border-radius: 0;
    animation: hud-in 170ms cubic-bezier(0.2, 0.7, 0.3, 1);
  }

  /* The strongest control-plane cue: the instrument is visibly wired to the
     desk it measures. ui/main.mjs supplies the length and angle it already
     computes from scene.screenPos(agentId). */
  .win[data-wired="true"]::after {
    content: "";
    position: absolute;
    top: 50%;
    width: var(--wire-len, 0px);
    height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent);
    transform: rotate(var(--wire-angle, 0deg));
    pointer-events: none;
    opacity: 0.7;
  }

  .win[data-wired="true"][data-wire-side="left"]::after {
    right: 100%;
    transform-origin: right center;
    background: linear-gradient(270deg, var(--accent), transparent);
  }

  .win[data-wired="true"][data-wire-side="right"]::after { left: 100%; transform-origin: left center; }

  /* A title bar is a telemetry line: label on the left, live number on the
     right. Every instrument reads out at least one number. */

  .win-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: calc(var(--step) * 2);
    padding: calc(var(--step) * 1.5) calc(var(--step) * 2) calc(var(--step) * 1.5) calc(var(--step) * 2.5);
    background: var(--nested);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
  }

  .win-title {
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
  }

  .win-sub {
    color: var(--accent);
    font-size: 10px;
    letter-spacing: 0.12em;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .win-bar .spacer { margin-left: auto; }

  .readout {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
    border-left: 1px solid var(--line);
    padding-left: calc(var(--step) * 2);
    white-space: nowrap;
  }

  /* Scale ticks down the reading edge: what makes a panel read as a gauge. */
  .win-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 0 calc(var(--step) * 2.5) calc(var(--step) * 3) calc(var(--step) * 3.5);
    background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 9px);
    background-size: 3px 100%;
    background-position: calc(var(--step) * 1) 0;
    background-repeat: no-repeat;
    scrollbar-width: thin;
    scrollbar-color: var(--sunk) transparent;
  }

  .win-body::-webkit-scrollbar { width: 8px; }
  .win-body::-webkit-scrollbar-thumb { background: var(--sunk); }
  .win-body::-webkit-scrollbar-track { background: transparent; }

  #queue { display: grid; gap: calc(var(--step) * 2); padding-top: calc(var(--step) * 2); align-content: start; }

  /* ------------------------------------------------------------ decisions */

  .decision {
    border: 1px solid var(--line);
    border-left: 2px solid var(--accent);
    padding: calc(var(--step) * 2.5);
    background: var(--nested);
  }

  .decision.loop, .decision.silent, .decision.blocked { border-left-color: var(--danger); }

  .decision > .head { display: flex; align-items: baseline; gap: calc(var(--step) * 2); margin-bottom: calc(var(--step) * 1.5); }
  .decision .who { color: var(--accent); letter-spacing: 0.08em; }
  .decision.loop .who, .decision.silent .who, .decision.blocked .who { color: var(--danger); }

  .decision .card-time {
    color: var(--faint);
    font-size: 9px;
    letter-spacing: 0.08em;
  }

  .decision .kind {
    margin-left: auto;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    border: 1px solid var(--line);
    padding: 0 5px;
  }

  .decision .detail {
    color: var(--text);
    font-size: 12px;
    line-height: 1.45;
    margin: 0 0 calc(var(--step) * 2.5);
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  /* An approval is a request, not an observation: the engine is parked until
     it is answered, so the card carries the accent - the one colour reserved
     for the thing that needs the user - and the answers are its loudest
     element. Red stays for genuine failure. */

  .decision.approval {
    border-color: var(--accent-edge);
    border-left-width: 3px;
    background: var(--surface);
    box-shadow: 0 0 14px -6px var(--accent-glow);
  }

  .decision.approval .who { color: var(--accent); }

  .decision.approval .frozen {
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 0 5px;
  }

  .decision.approval .kind { color: var(--accent); border-color: var(--accent-edge); }

  .decision .ask { color: var(--text); font-size: 13px; margin-bottom: calc(var(--step) * 1.5); word-break: break-word; }
  .decision .why { color: var(--muted); font-size: 11px; margin-bottom: calc(var(--step) * 1.5); word-break: break-word; }

  .decision .paths {
    display: grid;
    gap: 1px;
    margin-bottom: calc(var(--step) * 1.5);
    border-left: 1px solid var(--line);
    padding-left: calc(var(--step) * 2);
  }

  .decision .path { color: var(--faint); font-size: 11px; word-break: break-all; }

  .decision .context {
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.04em;
    margin-bottom: calc(var(--step) * 2);
    word-break: break-all;
  }

  .actions { display: flex; gap: calc(var(--step) * 1.5); flex-wrap: wrap; }

  button.act {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0;
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.12em;
    padding: 4px 9px;
    cursor: pointer;
    transition: color 120ms ease-out, border-color 120ms ease-out, transform 120ms ease-out;
  }

  button.act:hover { border-color: var(--accent-edge); color: var(--text); transform: translateY(-1px); }
  button.act[data-action="kill"]:hover { border-color: var(--danger-edge); color: var(--danger); }

  button.act.answer { color: var(--text); text-transform: uppercase; }

  button.act.answer[data-choice="accept"] {
    color: var(--accent);
    border-color: var(--accent-edge);
    background: var(--accent-soft);
    box-shadow: 0 0 10px -4px var(--accent-glow);
  }

  button.act.answer[data-choice="accept"]:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  button.act.answer[data-choice="decline"]:hover,
  button.act.answer[data-choice="cancel"]:hover { border-color: var(--danger-edge); color: var(--danger); }

  .steer { display: flex; align-items: center; gap: calc(var(--step) * 1.5); margin-top: calc(var(--step) * 2); }

  .steer input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 0;
    color: var(--text);
    font: inherit;
    font-size: 11px;
    padding: 4px 7px;
  }

  .steer input:focus { outline: none; border-color: var(--accent); }
  .steer .hint { flex: 0 0 auto; font-size: 10px; color: var(--faint); letter-spacing: 0.1em; text-transform: none; }

  .feed-chat {
    position: relative;
    flex: 0 0 auto;
    padding: calc(var(--step) * 2);
    border-top: 1px solid var(--line);
    background: var(--surface);
  }

  .feed-controls,
  .prayer-head {
    flex: 0 0 auto;
    padding: calc(var(--step) * 2) calc(var(--step) * 2.5) 0 calc(var(--step) * 3.5);
    background: var(--surface);
  }

  .feed-controls { border-bottom: 1px solid var(--line); }
  .feed-levels { display: flex; align-items: center; gap: var(--step); padding: var(--step) 0; }
  .feed-levels wa-button:last-child { margin-left: auto; }
  .feed-levels wa-button::part(base) {
    min-height: 28px;
    border-radius: 0;
    color: var(--faint);
    font: 9px var(--mono);
    letter-spacing: .08em;
  }
  .feed-levels wa-button[aria-pressed="true"]::part(base) {
    color: var(--accent);
    box-shadow: inset 0 -1px 0 var(--accent);
  }
  .feed-references {
    display: flex;
    flex-wrap: wrap;
    gap: var(--step);
    margin-top: var(--step);
  }
  .feed-references button,
  .feed-references a {
    padding: 1px 4px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--accent);
    font: 8px var(--mono);
    text-decoration: none;
    cursor: pointer;
  }

  .prayer-chat {
    position: relative;
    display: grid;
    gap: calc(var(--step) * 1.5);
  }

  .prayer-chat[hidden] { display: none; }

  .panel-compose-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "input input" "actions send";
    gap: calc(var(--step) * 1.5);
    align-items: end;
  }

  .panel-compose-input {
    grid-area: input;
    display: block;
    width: 100%;
    min-height: 34px;
    max-height: 35vh;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font: 13px/1.4 var(--mono);
    padding: 6px 10px;
  }

  .panel-compose-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 12px -4px var(--accent-glow);
  }
  .panel-compose-input[aria-invalid="true"] { border-color: var(--danger); }
  .panel-compose-input[aria-busy="true"] { opacity: .7; }

  .panel-compose-actions {
    grid-area: actions;
    display: flex;
    align-items: end;
    gap: calc(var(--step) * 1.5);
  }

  .panel-compose-row > .btn { grid-area: send; }

  .panel-attachments {
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--step) * 1.5);
    max-height: 76px;
    overflow: auto;
  }

  .panel-mention-menu {
    position: absolute;
    left: calc(var(--step) * 2);
    right: calc(var(--step) * 2);
    bottom: calc(100% + var(--step));
    max-height: 260px;
    overflow: auto;
    z-index: 3;
    background: var(--glass-solid);
    border: 1px solid var(--line);
  }

  .panel-mention-menu .mention-row { padding: 5px 8px; cursor: pointer; }
  .panel-mention-menu .mention-row[aria-selected="true"] { background: var(--accent-soft); }

  /* ------------------------------------------------------------------ runs */

  .run {
    display: grid;
    gap: 3px;
    padding: calc(var(--step) * 2) calc(var(--step) * 1.5);
    border-left: 2px solid transparent;
    border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
    transition: background-color 140ms ease-out;
  }

  .run:hover { background: var(--nested); }
  .run.is-live { border-left-color: var(--accent); }

  .run-head { display: flex; align-items: baseline; gap: calc(var(--step) * 2); }

  .run-mission {
    color: var(--text);
    font-size: 12px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .run.is-live .run-mission { color: var(--accent); }

  .run-live {
    margin-left: auto;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 0 5px;
    white-space: nowrap;
  }

  .run-meta {
    display: flex;
    gap: calc(var(--step) * 1.5);
    color: var(--faint);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    flex-wrap: wrap;
  }

  .run-meta .sep { color: var(--line); }
  .run-meta .running { color: var(--accent); }

  /* The tail of a path identifies it, so it truncates from the left. */
  .run-repo, .picker-head {
    direction: rtl;
    text-align: left;
    unicode-bidi: plaintext;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .run-repo { color: var(--faint); font-size: 10px; }

  button.run-stop {
    background: transparent;
    border: 1px solid var(--danger-edge);
    color: var(--danger);
    font: inherit;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 0 6px;
    cursor: pointer;
    transition: background-color 120ms ease-out, color 120ms ease-out;
  }

  button.run-stop:hover { background: var(--danger); color: var(--bg); }

  button.run.new {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px dashed var(--line);
    border-radius: 0;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: calc(var(--step) * 2);
    margin: calc(var(--step) * 2) 0;
    cursor: pointer;
    transition: color 140ms ease-out, border-color 140ms ease-out, background-color 140ms ease-out;
  }

  button.run.new:hover { color: var(--accent); border-color: var(--accent-edge); background: var(--accent-soft); }

  /* ------------------------------------------------------------ folder picker */

  .picker {
    position: fixed;
    top: calc(var(--topbar-h) + var(--gap) * 2);
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    width: min(520px, calc(100vw - var(--gap) * 4));
    display: flex;
    flex-direction: column;
    max-height: min(60vh, 460px);
    background: var(--glass-solid);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    animation: hud-in 160ms ease-out;
  }

  .picker-head {
    flex: 0 0 auto;
    padding: calc(var(--step) * 2) calc(var(--step) * 2.5);
    background: var(--nested);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
  }

  .picker-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: calc(var(--step) * 1) 0;
    scrollbar-width: thin;
    scrollbar-color: var(--sunk) transparent;
  }

  .picker-list::-webkit-scrollbar { width: 8px; }
  .picker-list::-webkit-scrollbar-thumb { background: var(--sunk); }
  .picker-list::-webkit-scrollbar-track { background: transparent; }

  .picker-row {
    padding: calc(var(--step) * 1.5) calc(var(--step) * 2.5);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    border-left: 2px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background-color 120ms ease-out;
  }

  .picker-row::before { content: "\25B8  "; color: var(--faint); }
  .picker-row:hover { background: var(--nested); }

  /* The list is walked with the keyboard, so plain :focus is the state that
     matters here - not only :focus-visible. */
  .picker-row:focus,
  .picker-row:focus-visible {
    outline: none;
    background: var(--accent-soft);
    border-left-color: var(--accent);
    color: var(--accent);
  }

  .picker > .act {
    flex: 0 0 auto;
    margin: calc(var(--step) * 2);
    padding: calc(var(--step) * 1.5) calc(var(--step) * 2);
    border-color: var(--accent-edge);
    background: var(--accent-soft);
    color: var(--accent);
    letter-spacing: 0.14em;
  }

  .picker > .act:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* --------------------------------------------------------- teaching bits */

  .teach { padding-top: calc(var(--step) * 2); }
  .teach-lede { color: var(--text); font-size: 12px; padding-bottom: calc(var(--step) * 1); }
  .teach-note { color: var(--muted); font-size: 11px; line-height: 1.55; padding-bottom: calc(var(--step) * 2); }

  .teach-head {
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 9px;
    color: var(--faint);
    padding: calc(var(--step) * 2) 0 calc(var(--step) * 1.5);
    border-top: 1px solid var(--line-soft);
  }

  .teach-list { display: grid; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); }

  .teach-item {
    display: grid;
    grid-template-columns: 70px minmax(0, 1fr);
    gap: calc(var(--step) * 2);
    align-items: baseline;
    background: var(--surface);
    padding: calc(var(--step) * 1.5) calc(var(--step) * 2);
  }

  .teach-key { text-transform: uppercase; letter-spacing: 0.14em; font-size: 9px; color: var(--muted); }
  .teach-val { color: var(--faint); font-size: 11px; }

  /* Nothing on the floor is invented, so there is no ghost row to style. */

  .decision.hollow { border-left-color: var(--line); background: transparent; box-shadow: none; }
  .decision.hollow .teach { padding-top: 0; }

  /* --------------------------------------------------------- flow contract */

  .flow {
    display: grid;
    gap: calc(var(--step) * 1.5);
    padding: calc(var(--step) * 2) 0;
    border-bottom: 1px solid var(--line-soft);
  }

  .flow:last-child { border-bottom: 0; }

  .flow-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: calc(var(--step) * 2);
    align-items: baseline;
  }

  .flow-result { font-size: 12px; color: var(--text); }
  .flow.is-verified .flow-result { color: var(--accent); }

  /* --------------------------------------------------------- checkpoints
     This is a work queue, not a build log. The collapsed row says the user
     outcome, owner and current state. Technical details stay one click away. */
  .checkpoint-summary {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    border: 1px solid var(--line);
    background: var(--line);
    gap: 1px;
    min-width: 0;
  }

  .checkpoint-toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: calc(var(--step) * 2);
    align-items: stretch;
    margin-bottom: calc(var(--step) * 3);
  }

  .checkpoint-add { min-width: 132px; }

  .checkpoint-create {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(180px, .32fr);
    gap: calc(var(--step) * 2);
    margin: 0 0 calc(var(--step) * 4);
    padding: calc(var(--step) * 3);
    border: 1px solid var(--line);
    background: var(--nested);
  }

  .checkpoint-field {
    display: grid;
    gap: var(--step);
    min-width: 0;
    color: var(--faint);
    font-size: 9px;
    letter-spacing: .12em;
  }

  .checkpoint-field.is-wide { grid-column: 1 / -1; }
  .checkpoint-field input,
  .checkpoint-field select {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    box-sizing: border-box;
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--surface);
    color: var(--text);
    font: 11px/1.4 var(--mono);
    padding: 0 calc(var(--step) * 2);
  }

  .checkpoint-field input:focus,
  .checkpoint-field select:focus { outline: 1px solid var(--accent); outline-offset: 1px; }
  .checkpoint-create-actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: calc(var(--step) * 1.5);
  }

  .checkpoint-create-actions .btn { min-height: 44px; min-width: 88px; }

  .checkpoint-count {
    min-width: 0;
    border: 0;
    border-radius: 0;
    background: var(--surface);
    color: var(--faint);
    padding: calc(var(--step) * 2);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 400;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: .1em;
    white-space: nowrap;
  }

  .checkpoint-count strong { color: var(--text); font-weight: 400; }
  .checkpoint-filter { cursor: pointer; }
  .checkpoint-filter:hover { background: var(--nested); color: var(--text); }
  .checkpoint-filter:focus-visible { outline: 1px solid var(--accent); outline-offset: -2px; }
  .checkpoint-filter[aria-pressed="true"] {
    background: var(--nested);
    box-shadow: inset 0 -2px 0 var(--accent);
    color: var(--accent);
  }
  .checkpoint-filter[aria-pressed="true"] strong { color: var(--accent); }
  .checkpoint-section { margin-bottom: calc(var(--step) * 4); }
  .checkpoint-section-title {
    display: flex;
    align-items: baseline;
    gap: calc(var(--step) * 2);
    margin: 0;
    padding: 0 0 calc(var(--step) * 1.5);
    color: var(--faint);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: .16em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
  }

  .checkpoint-section-title span { color: var(--text); }
  .checkpoint-empty { margin: 0; padding: calc(var(--step) * 3) 0; color: var(--faint); }
  .checkpoint-row {
    display: grid;
    grid-template-columns: minmax(240px, 1fr) auto;
    grid-template-areas: "line controls" "details details";
    gap: calc(var(--step) * 2);
    align-items: start;
    padding: calc(var(--step) * 2.5) 0;
    border-bottom: 1px solid var(--line-soft);
  }

  .checkpoint-row.is-running { border-left: 2px solid var(--accent); padding-left: calc(var(--step) * 2); }
  .checkpoint-row.is-done .checkpoint-label { color: var(--muted); }
  .checkpoint-line {
    grid-area: line;
    display: grid;
    gap: var(--step);
    min-width: 0;
  }

  .checkpoint-title {
    display: flex;
    align-items: baseline;
    gap: calc(var(--step) * 1.5);
    min-width: 0;
    width: fit-content;
    max-width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .checkpoint-title:hover .checkpoint-label { color: var(--accent); }
  .checkpoint-title:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

  .checkpoint-id {
    flex: none;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .checkpoint-label {
    flex: 1;
    min-width: 0;
    color: var(--text);
    font-size: 13px;
    line-height: 1.35;
    font-weight: 400;
  }

  .checkpoint-description {
    display: -webkit-box;
    margin: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.45;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .checkpoint-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: calc(var(--step) * 3);
    min-width: 0;
  }

  .checkpoint-state {
    display: inline-flex;
    align-items: center;
    gap: var(--step);
    color: var(--muted);
    font-size: 10px;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .checkpoint-timing {
    display: inline-flex;
    align-items: center;
    gap: calc(var(--step) * 1.5);
    color: var(--faint);
    font-size: 9px;
    letter-spacing: .08em;
    white-space: nowrap;
  }

  .checkpoint-icon {
    width: 16px;
    height: 16px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: square;
    stroke-linejoin: miter;
  }

  .checkpoint-row.is-running .checkpoint-state { color: var(--accent); }
  .checkpoint-controls {
    grid-area: controls;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    gap: calc(var(--step) * 2);
    white-space: nowrap;
  }
  .checkpoint-actions { display: inline-flex; align-items: flex-start; gap: 0; }
  .checkpoint-button,
  .checkpoint-owner {
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font: 9px/1 var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .checkpoint-button {
    display: inline-grid;
    width: 44px;
    padding: 0;
    border-color: transparent;
    place-items: center;
    cursor: pointer;
  }
  .checkpoint-button .checkpoint-icon { width: 14px; height: 14px; }
  .checkpoint-button:hover { color: var(--text); border-color: transparent; background: var(--nested); }
  .checkpoint-button:focus-visible { outline: 1px solid var(--accent); outline-offset: -4px; }
  .checkpoint-owner:hover { color: var(--text); border-color: var(--accent-edge); }
  .checkpoint-button:disabled { opacity: .35; cursor: default; }
  .checkpoint-button:disabled:hover { color: var(--muted); border-color: transparent; background: transparent; }
  .checkpoint-owner { min-width: 120px; padding: 0 calc(var(--step) * 1.5); cursor: pointer; }
  .checkpoint-details { grid-area: details; color: var(--muted); }
  .checkpoint-details > summary {
    width: fit-content;
    color: var(--faint);
    cursor: pointer;
    font-size: 9px;
    letter-spacing: .12em;
  }

  .checkpoint-details > summary:hover { color: var(--text); }
  .checkpoint-detail-body {
    display: grid;
    gap: calc(var(--step) * 1.5);
    margin-top: calc(var(--step) * 2);
    padding: calc(var(--step) * 2);
    background: var(--nested);
    border-left: 1px solid var(--line);
  }

  .checkpoint-detail-line {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr);
    gap: calc(var(--step) * 2);
    align-items: baseline;
  }

  .checkpoint-detail-line > span { color: var(--faint); font-size: 9px; letter-spacing: .1em; }
  .checkpoint-detail-line > p { margin: 0; color: var(--text); font-size: 11px; overflow-wrap: anywhere; }

  .checkpoint-chat {
    flex: none;
    padding: calc(var(--step) * 2);
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .checkpoint-chat[hidden] { display: none; }
  .checkpoint-compose-reply {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--step) calc(var(--step) * 2);
    color: var(--muted);
    border-left: 2px solid var(--accent);
    background: var(--nested);
    font-size: 9px;
  }
  .checkpoint-compose-reply[hidden] { display: none; }
  .checkpoint-compose-reply button {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
  }
  .checkpoint-thread { display: grid; gap: calc(var(--step) * 3); min-width: 0; }
  .checkpoint-thread-head {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: calc(var(--step) * 3);
    align-items: start;
    border-bottom: 1px solid var(--line);
    padding-bottom: calc(var(--step) * 3);
  }
  .checkpoint-thread-identity { display: grid; gap: var(--step); }
  .checkpoint-thread-identity h2 { margin: 0; color: var(--text); font: 16px/1.3 var(--mono); }
  .checkpoint-thread-identity p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
  .checkpoint-thread-facts { display: flex; flex-wrap: wrap; gap: calc(var(--step) * 3); align-items: center; }
  .checkpoint-person {
    padding: 0;
    border: 0;
    border-bottom: 1px solid var(--accent-edge);
    background: transparent;
    color: var(--accent);
    font: 10px var(--mono);
    cursor: pointer;
  }
  .checkpoint-thread-details::part(base) { border: 1px solid var(--line); border-radius: 0; background: var(--nested); }
  .checkpoint-thread-details::part(header) { color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; }
  .checkpoint-timeline { display: grid; gap: 0; }
  .checkpoint-message { padding: calc(var(--step) * 3) 0; border-bottom: 1px solid var(--line-soft); }
  .checkpoint-message[data-reply-to] { padding-left: calc(var(--step) * 4); border-left: 1px solid var(--line); }
  .checkpoint-message-head { display: flex; gap: calc(var(--step) * 2); align-items: baseline; color: var(--muted); font-size: 9px; }
  .checkpoint-message-head strong { color: var(--text); font-size: 11px; font-weight: 400; }
  .checkpoint-reply-mark { color: var(--faint); }
  .checkpoint-message-body { margin-top: var(--step); color: var(--text); font-size: 11px; line-height: 1.55; }
  .checkpoint-message-actions { display: flex; gap: var(--step); margin-top: calc(var(--step) * 1.5); }
  .checkpoint-message-actions wa-button::part(base),
  .checkpoint-thread-head wa-button::part(base) {
    min-height: 28px;
    padding: 0 var(--step);
    border-radius: 0;
    color: var(--muted);
    font: 9px var(--mono);
  }
  .checkpoint-message-actions wa-button:hover::part(base),
  .checkpoint-thread-head wa-button:hover::part(base) { color: var(--accent); background: var(--nested); }
  .checkpoint-attachments { display: flex; flex-wrap: wrap; gap: calc(var(--step) * 2); margin-top: calc(var(--step) * 2); }
  .checkpoint-attachment img { display: block; width: 112px; height: 72px; object-fit: cover; border: 1px solid var(--line); }
  .checkpoint-references { display: flex; flex-wrap: wrap; gap: var(--step); margin-top: calc(var(--step) * 1.5); }
  .checkpoint-references button,
  .checkpoint-references a { padding: 2px 5px; border: 1px solid var(--line); background: transparent; color: var(--accent); font: 9px var(--mono); text-decoration: none; cursor: pointer; }

  @media (max-width: 900px) {
    .checkpoint-toolbar,
    .checkpoint-create { grid-template-columns: minmax(0, 1fr); }
    .checkpoint-field.is-wide,
    .checkpoint-create-actions { grid-column: 1; }
    .checkpoint-add { min-height: 44px; }
    .checkpoint-row {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "line" "controls" "details";
    }
    .checkpoint-controls { justify-content: flex-start; flex-wrap: wrap; }
  }

  @media (max-width: 720px) {
    .checkpoint-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .checkpoint-thread-head { grid-template-columns: minmax(0, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    wa-button, wa-details { --wa-transition-normal: 0ms; --wa-transition-slow: 0ms; }
  }

  .ladder { display: inline-flex; align-items: center; gap: calc(var(--step) * 1.5); white-space: nowrap; }
  .ladder .pips { display: inline-flex; gap: 2px; }
  .ladder .pips i { width: 8px; height: 3px; background: var(--sunk); display: block; }
  .ladder .pips i.on { background: var(--muted); }
  .ladder[data-status="verified"] .pips i.on { background: var(--accent); }
  .ladder .word { text-transform: uppercase; letter-spacing: 0.16em; font-size: 9px; color: var(--faint); }
  .ladder[data-status="wired"] .word { color: var(--muted); }
  .ladder[data-status="verified"] .word { color: var(--accent); }
  .ladder[data-status="running"] .word { color: var(--text); }
  .ladder[data-status="blocked"] .word { color: var(--danger); }

  /* The flow tree. Same row shape at group, repo and step, so a column of
     gates reads straight down a multi-repo mission. */
  .flow-left {
    display: flex; align-items: baseline; gap: calc(var(--step) * 1.5);
    padding: calc(var(--step)) 0 calc(var(--step) * 1.5);
    border-bottom: 1px solid var(--line); margin-bottom: calc(var(--step) * 1.5);
    font-size: 11px;
  }
  .flow-left-label { color: var(--faint); letter-spacing: .14em; text-transform: uppercase; font-size: 9px; }
  .flow-left-value { color: var(--text); font-variant-numeric: tabular-nums; }
  .flow-left-pct { margin-left: auto; color: var(--accent); font-variant-numeric: tabular-nums; }

  .flow-scope-head {
    display: flex; align-items: center; gap: calc(var(--step) * 1.5);
    width: 100%; padding: calc(var(--step)) 0; cursor: pointer;
    background: transparent; border: 0; color: inherit; font: inherit; text-align: left;
  }
  .flow-scope-head:hover .flow-scope-name { color: var(--accent); }
  .flow-caret { flex: none; width: 10px; color: var(--faint); font-size: 10px; }
  .flow-scope-name {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text); font-size: 12px;
  }
  .flow-scope-count {
    flex: none; color: var(--faint); font-size: 10px; font-variant-numeric: tabular-nums;
  }
  .flow-scope-pct {
    flex: none; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums;
    min-width: 34px; text-align: right;
  }

  /* The gates, said in words. They were single letters and two of them were
     "C" - unreadable, and nothing to hover for an explanation. */
  .gates { flex: none; display: flex; flex-wrap: wrap; gap: 3px; }
  .gate {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 5px; font-size: 9px; line-height: 1.5;
    letter-spacing: .06em; text-transform: uppercase;
    border: 1px solid var(--line); color: var(--faint); background: transparent;
    cursor: help;
  }
  .gate::before { content: ""; }
  .gate.is-pass { border-color: var(--accent); color: var(--accent); }
  .gate.is-pass::before { content: "✓"; font-size: 9px; }
  .gate.is-fail {
    border-color: var(--danger); color: var(--danger); background: var(--danger-soft);
  }
  .gate.is-fail::before { content: "✕"; font-size: 9px; }
  .gate.is-running { border-color: var(--accent); color: var(--accent); opacity: .6; }
  .gate.is-running::before { content: ""; }

  /* Altitude: the whole mission, one repo, one feature, or every step. */
  .zoom {
    display: flex; align-items: center; gap: 4px;
    padding-bottom: calc(var(--step) * 1.5);
  }
  .zoom-step {
    background: transparent; border: 1px solid var(--line); color: var(--faint);
    font: inherit; font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    padding: 2px 7px; cursor: pointer;
  }
  .zoom-step:hover { color: var(--text); }
  .zoom-step[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  /* One line: what it is, the two durations, how far past the promise. */
  .burn { display: flex; align-items: baseline; gap: calc(var(--step) * 1.5); font-size: 11px; }
  .burn-label { color: var(--faint); letter-spacing: 0.14em; text-transform: uppercase; font-size: 9px; }
  .burn-value { color: var(--muted); font-variant-numeric: tabular-nums; }
  .burn-pct { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .burn.over .burn-value, .burn.over .burn-pct { color: var(--danger); }
  .burn.none .burn-value { color: var(--faint); }

  /* -------------------------------------------------------------- evidence */

  .claim {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr);
    gap: calc(var(--step) * 2);
    padding: calc(var(--step) * 1.5) 0;
    border-bottom: 1px solid var(--line-soft);
  }

  .claim:last-child { border-bottom: 0; }

  .grade {
    font-size: 9px;
    letter-spacing: 0.04em;
    text-align: center;
    padding: 1px 0;
    border: 1px solid var(--line);
    color: var(--muted);
    height: fit-content;
  }

  .claim.observed .grade { color: var(--accent); border-color: var(--accent-edge); background: var(--accent-soft); }
  .claim.guessed .grade { color: var(--faint); border-style: dashed; }

  .claim .text { color: var(--text); word-break: break-word; }
  .claim .receipt { color: var(--faint); font-size: 11px; margin-top: 2px; word-break: break-word; }

  /* A claim with no command behind it must LOOK unbacked. */
  .claim.guessed { opacity: 0.42; }
  .claim.guessed .text { text-decoration: line-through; text-decoration-thickness: 1px; }

  /* ------------------------------------------------------------------ crew */

  .agent {
    padding-block: calc(var(--step) * 2);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto auto;
    grid-template-areas: "id copies engine runtime" "goal goal goal goal" "chat chat chat chat" "connections connections connections connections";
    gap: calc(var(--step) * 1) calc(var(--step) * 2);
    align-items: center;
    padding: calc(var(--step) * 2) calc(var(--step) * 1.5);
    border-left: 2px solid transparent;
    border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
    transition: background-color 140ms ease-out;
  }

  .agent:last-child { border-bottom: 0; }
  .agent:hover { background: var(--nested); }
  .agent[aria-selected="true"] { border-left-color: var(--accent); background: var(--nested); }

  .agent .ident { grid-area: id; display: flex; align-items: baseline; gap: calc(var(--step) * 2); min-width: 0; flex-wrap: wrap; }

  /* A persona label carries its seat, so it can get long. It shortens rather
     than wrapping the row onto two lines. */
  .agent .name {
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text);
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .agent .role { flex: 0 0 auto; }
  .agent[aria-selected="true"] .name { color: var(--accent); text-shadow: 0 0 8px var(--accent-glow); }
  .agent .role { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }

  .status { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; white-space: nowrap; }
  .status .dot { width: 5px; height: 5px; background: var(--faint); flex: 0 0 auto; }
  .status .word { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .status[data-status="running"] .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .status[data-status="running"] .word { color: var(--accent); }
  .status[data-status="blocked"] .dot { background: var(--danger); }
  .status[data-status="blocked"] .word { color: var(--danger); }
  /* Benched is not a quieter kind of idle: the seat is off the mission. It is
     the toggle's own state, said in words next to everyone else's. */
  .status[data-status="benched"] .dot { background: transparent; box-shadow: inset 0 0 0 1px var(--muted); }
  .status[data-status="benched"] .word { color: var(--muted); }

  .agent .goal { grid-area: goal; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .agent .steer { grid-area: chat; min-width: 0; }
  .agent .goal-label {
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint);
  }

  .agent .goal-input {
    width: 100%;
    min-height: 2.6em;
    resize: vertical;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    line-height: 1.45;
    padding: 5px 7px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .agent .goal-input:hover { border-color: var(--muted); }
  .agent .goal-input:focus { outline: none; border-color: var(--accent); }

  .agent .goal-input::placeholder { color: var(--faint); }
  .agent input.goal-input:hover { color: var(--text); border-bottom-color: var(--line); }
  .agent input.goal-input:focus { outline: none; color: var(--text); border-bottom-color: var(--accent); }
  .agent-connections {
    grid-area: connections;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: calc(var(--step) * 3);
    margin-top: var(--step);
    padding-top: calc(var(--step) * 2);
    border-top: 1px solid var(--line);
    cursor: default;
  }
  .agent-connections h4 { margin: 0 0 var(--step); color: var(--faint); font: 9px var(--mono); letter-spacing: .12em; }
  .agent-work-list, .agent-message-list { display: grid; align-content: start; gap: 1px; min-width: 0; }
  .agent-work-link, .agent-message-link {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: calc(var(--step) * 1.5);
    align-items: baseline;
    min-width: 0;
    padding: var(--step);
    border: 0;
    background: var(--surface);
    color: var(--text);
    font: 9px/1.4 var(--mono);
    text-align: left;
  }
  button.agent-work-link, button.agent-message-link { cursor: pointer; }
  button.agent-work-link:hover, button.agent-message-link:hover { background: var(--accent-soft); color: var(--accent); }
  .agent-work-link > span:nth-child(2), .agent-message-link > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-work-state { color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }
  .agent-empty { margin: 0; padding: var(--step); color: var(--faint); font-size: 9px; }

  /* How many of this hero. It sits beside the engine switch and is built the
     same way - one sunk strip, no floating boxes - because they are the same
     kind of control: what this seat IS, not what it is doing. */
  .copies { grid-area: copies; display: inline-flex; align-items: stretch; background: var(--sunk); padding: 1px; gap: 1px; }

  .copies button {
    background: transparent;
    border: 0;
    color: var(--faint);
    font: inherit;
    font-size: 11px;
    line-height: 1;
    padding: 2px 7px;
    cursor: pointer;
    transition: color 140ms ease-out;
  }

  .copies button:hover:not(:disabled) { color: var(--text); }
  .copies button:disabled { color: var(--line); cursor: default; }

  .copies .copies-count {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--muted);
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
  }

  /* More than one worker on a seat is a real decision, so it stops being grey. */
  .copies[data-many="yes"] .copies-count { color: var(--text); }

  .engine { grid-area: engine; display: inline-flex; background: var(--sunk); padding: 1px; gap: 1px; }

  .engine button {
    background: transparent;
    border: 0;
    color: var(--faint);
    font: inherit;
    font-size: 9px;
    letter-spacing: 0.14em;
    padding: 2px 6px;
    cursor: pointer;
    transition: color 140ms ease-out, background-color 140ms ease-out;
  }

  .engine button:hover { color: var(--text); }
  .engine button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }

  .agent[aria-selected="true"] .engine button[aria-pressed="true"] {
    color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent-edge);
  }

  .runtime-controls {
    grid-area: runtime;
    display: inline-flex;
    gap: 1px;
    padding: 1px;
    background: var(--sunk);
  }

  .runtime-controls select {
    min-width: 76px;
    max-width: 130px;
    border: 0;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 9px;
    letter-spacing: 0.1em;
    padding: 3px 18px 3px 6px;
  }

  .runtime-controls select:focus { outline: 1px solid var(--accent); }

  @media (max-width: 760px) {
    .agent {
      grid-template-columns: minmax(0, 1fr) auto auto;
      grid-template-areas: "id copies engine" "runtime runtime runtime" "goal goal goal" "chat chat chat" "connections connections connections";
    }
    .runtime-controls { justify-self: start; }
    .agent-connections { grid-template-columns: minmax(0, 1fr); }
  }

  /* --------------------------------------------------------------- console
     The composer is the console: same glass and brackets, dock buttons as
     instrument switches, and one warning lamp. */

  #composer {
    position: fixed;
    left: 50%;
    bottom: var(--gap);
    transform: translateX(-50%);
    z-index: 50;
    width: min(920px, calc(100vw - var(--gap) * 2));
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "attach attach attach" "target input send" "dock dock dock";
    align-items: center;
    gap: calc(var(--step) * 2);
    padding: calc(var(--step) * 2.5);
    background: var(--glass);
    backdrop-filter: blur(10px) saturate(1.1);
    border: 1px solid var(--line);
  }

  #composerTarget {
    grid-area: target;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-edge);
    padding: 4px 8px;
    white-space: nowrap;
  }

  #composerTarget[data-target="mission"] { color: var(--muted); background: transparent; border-color: var(--line); }

  /* The editor grows upward with its formatted blocks. Its bottom edge stays
     pinned, and long drafts scroll inside the 35vh cap. */
  #composerInput {
    grid-area: input;
    display: block;
    width: 100%;
    min-height: 34px;
    max-height: 35vh;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.4;
    padding: 6px 10px;
    transition: border-color 140ms ease-out, box-shadow 140ms ease-out;
  }

  #composerInput:empty::before,
  .panel-compose-input:empty::before {
    content: attr(data-placeholder);
    color: var(--faint);
    pointer-events: none;
  }
  #composerInput:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 12px -4px var(--accent-glow); }
  #composer.is-collapsed #composerInput {
    height: 34px;
    max-height: 34px;
    overflow: hidden;
    white-space: nowrap;
  }
  #composer.is-collapsed #composerInput > * { display: inline; }
  #composerSend { grid-area: send; }

  .dock { grid-area: dock; display: flex; align-items: center; gap: calc(var(--step) * 1.5); flex-wrap: wrap; }

  .dock-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 3px 9px;
    cursor: pointer;
    transition: color 140ms ease-out, border-color 140ms ease-out, background-color 140ms ease-out, box-shadow 140ms ease-out;
  }

  .dock-btn:hover { color: var(--text); border-color: var(--accent-edge); }

  /* A lit switch. */
  .dock-btn[aria-pressed="true"] {
    color: var(--accent);
    border-color: var(--accent-edge);
    background: var(--accent-soft);
    box-shadow: 0 0 12px -3px var(--accent-glow), inset 0 0 10px -6px var(--accent-glow);
  }

  /* Camera scale is a room instrument, so it lives beside the other console
     instruments instead of floating over the room. */
  #sceneZoom {
    display: inline-flex;
    align-items: center;
    height: 44px;
    background: transparent;
    border: 1px solid var(--line);
  }

  #sceneZoom button {
    display: inline-grid;
    width: 44px;
    height: 42px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--text);
    place-items: center;
    cursor: pointer;
    transition: color 140ms ease-out, background-color 140ms ease-out, transform 120ms ease-out;
  }

  #sceneZoom svg,
  #composerCollapse svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: square;
    stroke-linejoin: miter;
  }

  #composerCollapse svg { transition: transform 140ms ease-out; }
  #composerCollapse[aria-expanded="false"] svg { transform: rotate(180deg); }
  #composerCollapse { width: 44px; min-height: 44px; justify-content: center; padding: 0; }

  #sceneZoom button + output,
  #sceneZoom output + button { border-left: 1px solid var(--line); }
  #sceneZoom button:hover { color: var(--accent); background: var(--accent-soft); }
  #sceneZoom button:active { transform: translateY(1px); }
  #sceneZoom button:focus-visible,
  #composerCollapse:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    #composerCollapse svg { transition: none; }
  }
  #sceneZoom button:disabled { color: var(--faint); cursor: default; opacity: 0.5; }
  #sceneZoom button:disabled:hover { background: transparent; }
  #sceneZoom output {
    min-width: 52px;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
  }

  #queueCount {
    font-variant-numeric: tabular-nums;
    min-width: 15px;
    text-align: center;
    padding: 0 4px;
    border: 1px solid var(--line);
    color: var(--faint);
    letter-spacing: 0.04em;
  }

  /* The warning lamp. It lights only when the queue actually holds a card,
     read straight off the rendered DOM so there is no second source of truth
     for "is anything waiting". */
  body:has(#queue .decision:not(.hollow)) #btnDecisions {
    color: var(--accent);
    border-color: var(--accent-edge);
  }

  body:has(#queue .decision:not(.hollow)) #queueCount {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 0 10px -1px var(--accent-glow);
    animation: lamp 1.8s ease-in-out infinite;
  }

  /* Something is waiting on you, and it keeps saying so. The attribute is set
     by ui/main.mjs from the same queue the cards are rendered from, so there
     is no second answer to "is anything waiting". */
  body[data-owed="yes"] #btnDecisions { color: var(--accent); border-color: var(--accent-edge); }

  body[data-owed="yes"] #queueCount {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    animation: lamp 1.4s ease-in-out infinite;
  }

  /* ----------------------------------------------------------- attachments
     A wrapping chip row above the input. It must never push the input off
     the bottom of the screen, so it scrolls once it gets tall. */

  #attachments {
    grid-area: attach;
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--step) * 1.5);
    max-height: 76px;
    overflow: auto;
    padding-bottom: calc(var(--step) * 0.5);
    scrollbar-width: thin;
    scrollbar-color: var(--sunk) transparent;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 260px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 2px 4px 2px 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chip::before { content: "\2317"; color: var(--faint); }

  .chip.error {
    border-color: var(--danger-edge);
    color: var(--danger);
    background: var(--danger-soft);
    padding-right: 7px;
  }

  .chip.error::before { content: "!"; color: var(--danger); }

  .chip-x {
    background: transparent;
    border: 0;
    color: var(--faint);
    font: inherit;
    font-size: 12px;
    line-height: 1;
    padding: 0 3px;
    cursor: pointer;
    transition: color 120ms ease-out;
  }

  .chip-x:hover { color: var(--danger); }

  .dock-btn.mini { padding: 3px 7px; letter-spacing: 0.12em; }

  /* A drop target in the HUD language: an inset emerald frame with corner
     brackets over the whole window. It is an overlay, so nothing shifts. */
  body.dropping::after {
    content: "DROP TO ATTACH";
    position: fixed;
    inset: var(--gap);
    z-index: 70;
    pointer-events: none;
    display: grid;
    align-content: start;
    justify-content: center;
    padding-top: calc(var(--topbar-h) + var(--gap) * 3);
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent-glow);
    --bracket: 26px;
    --hair: 1px;
    background:
      linear-gradient(var(--accent), var(--accent)) 0 0 / var(--bracket) var(--hair) no-repeat,
      linear-gradient(var(--accent), var(--accent)) 0 0 / var(--hair) var(--bracket) no-repeat,
      linear-gradient(var(--accent), var(--accent)) 100% 0 / var(--bracket) var(--hair) no-repeat,
      linear-gradient(var(--accent), var(--accent)) 100% 0 / var(--hair) var(--bracket) no-repeat,
      linear-gradient(var(--accent), var(--accent)) 0 100% / var(--bracket) var(--hair) no-repeat,
      linear-gradient(var(--accent), var(--accent)) 0 100% / var(--hair) var(--bracket) no-repeat,
      linear-gradient(var(--accent), var(--accent)) 100% 100% / var(--bracket) var(--hair) no-repeat,
      linear-gradient(var(--accent), var(--accent)) 100% 100% / var(--hair) var(--bracket) no-repeat,
      var(--accent-soft);
    box-shadow: inset 0 0 0 1px var(--accent-edge);
    animation: hud-in 140ms ease-out;
  }

  /* Completions open upward, so the console never leaves the bottom edge. */
  #mentionMenu {
    position: absolute;
    left: calc(var(--step) * 2);
    right: calc(var(--step) * 2);
    bottom: calc(100% + var(--step));
    max-height: 260px;
    overflow: auto;
    background: var(--glass-solid);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    padding: calc(var(--step) * 1) 0;
  }

  #mentionMenu .mention {
    display: grid;
    grid-template-columns: minmax(0, auto) minmax(0, 1fr);
    gap: calc(var(--step) * 2);
    align-items: baseline;
    padding: calc(var(--step) * 1.25) calc(var(--step) * 3);
    cursor: pointer;
    border-left: 2px solid transparent;
  }

  #mentionMenu .mention .key { color: var(--text); }
  #mentionMenu .mention .hint { color: var(--faint); font-size: 11px; text-transform: none; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mentionMenu .mention:hover { background: var(--nested); }
  #mentionMenu .mention[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
  #mentionMenu .mention[aria-selected="true"] .key { color: var(--accent); }

  /* ---------------------------------------------------------------- motion
     A HUD boots: a quick wipe in, transform and opacity only, no bounce. */

  @keyframes hud-in {
    from { opacity: 0; transform: scaleY(0.94) translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes lamp {
    0%, 100% { box-shadow: 0 0 10px -1px var(--accent-glow); }
    50% { box-shadow: 0 0 16px 1px var(--accent-glow); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 900px) {
    .hint { display: none; }
    .win[data-wired="true"]::after { display: none; }
  }

  /* ------------------------------------------------------------------ brand
     The mark ships as flat black artwork, so it is used as a MASK rather than
     an image: the colour then comes from the theme and never disappears
     against a dark bar. */
  /* The artwork as drawn. It was a CSS mask filled with the accent, which is
     why it came out green - a mask throws the logo's own colours away. */
  .brand { display: inline-flex; align-items: center; }
  .brand-logo {
    display: block;
    width: 116px;
    height: 26px;
    object-fit: contain;
    object-position: left center;
  }
</style>
</head>
<body>
  <div id="crewBar" class="crewbar" role="group" aria-label="the Avengers, and what each is doing"></div>
  <canvas id="floor"></canvas>
  <div id="bubbles"></div>

  <div id="topbar">
    <span class="brand"><img class="brand-logo" src="/assets/brand/minimac-logo-transparent.svg" alt="MINIMAC"></span>
    <button id="repoPath" type="button" title="Open the repo this fleet works in">~/wednesday/minimac</button>
    <button class="btn" id="planAll" type="button" title="Thor decides who this mission needs, brings them on and stands the rest down">ASSEMBLE</button>
    <button class="btn primary" id="startAll" type="button">START ALL</button>
    <button class="btn stop" id="stopAll" type="button" title="Interrupt every running agent and close the run">STOP</button>
    <!-- The floor's voice. A switch, not a button: it has two states and you
         can see which one it is in without reading a word. -->
    <span class="switch-cell">
      <span class="switch-icon" aria-hidden="true">&#9834;</span>
      <button class="switch" id="btnSound" type="button" role="switch" aria-checked="false"
              aria-label="Floor sound"
              title="Ambient sound, and one cue per event"><i></i></button>
    </span>
  </div>

  <!-- Instruments. ui/windows.mjs places, drags and resizes these. -->
  <div id="windows">

    <section class="win" id="winFlows" hidden aria-label="Flow contract">
      <i class="hud-frame" aria-hidden="true"></i>
      <header class="win-bar" id="winFlowsBar">
        <span class="win-title">flow</span>
        <span class="win-sub" id="focusName">—</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="winFlowsClose" type="button" aria-label="Close flow contract">✕</button>
      </header>
      <div class="win-body" id="flows"></div>
    </section>


    <!-- The whole crew at once. Flow and evidence belong to ONE agent and now
         live at that agent's desk; who is on the mission is a fleet-wide
         question, so it keeps a fleet-wide list. -->
    <section class="win" id="winCrew" hidden aria-label="Avengers">
      <i class="hud-frame" aria-hidden="true"></i>
      <header class="win-bar" id="winCrewBar">
        <span class="win-title">avengers</span>
        <span class="spacer"></span>
        <span class="readout" id="roCrew">0/0 RUNNING</span>
        <button class="icon-btn" id="winCrewClose" type="button" aria-label="Close Avengers">✕</button>
      </header>
      <div class="win-body" id="roster"></div>
    </section>

    <section class="win" id="winDecisions" hidden aria-label="Decisions">
      <i class="hud-frame" aria-hidden="true"></i>
      <header class="win-bar" id="winDecisionsBar">
        <span class="win-title">decisions</span>
        <span class="spacer"></span>
        <span class="readout" id="roDecisions">0 WAITING</span>
        <button class="icon-btn" id="winDecisionsClose" type="button" aria-label="Close decisions">✕</button>
      </header>
      <div class="prayer-head" id="prayerHead" hidden></div>
      <div class="win-body"><div id="queue" aria-live="polite"></div></div>
      <footer class="feed-chat prayer-chat" id="prayerChat" hidden></footer>
    </section>

    <section class="win" id="winRuns" hidden aria-label="Runs">
      <i class="hud-frame" aria-hidden="true"></i>
      <header class="win-bar" id="winRunsBar">
        <span class="win-title">runs</span>
        <span class="spacer"></span>
        <span class="readout" id="roRuns">0 MISSIONS</span>
        <button class="icon-btn" id="winRunsClose" type="button" aria-label="Close runs">✕</button>
      </header>
      <div class="win-body" id="runs"></div>
    </section>
  </div>

  <div id="composer">
    <i class="hud-frame" aria-hidden="true"></i>
    <div id="attachments" hidden aria-label="Attached files"></div>
    <input type="file" id="fileInput" multiple hidden />
    <span id="composerTarget" data-target="mission">mission</span>
    <div id="composerInput" class="md" contenteditable="true" spellcheck="true"
         role="textbox" aria-multiline="true" aria-label="Command the fleet"
         data-placeholder="set the mission, or steer CODER · @file  /skill  @agent"></div>
    <button class="btn primary" id="composerSend" type="button">SEND</button>

    <div class="dock">
      <button class="dock-btn" id="btnFlows" type="button" aria-pressed="false" aria-controls="winFlows">flow</button>
      <button class="dock-btn" id="btnCrew" type="button" aria-pressed="false" aria-controls="winCrew">avengers</button>
      <button class="dock-btn" id="btnDecisions" type="button" aria-pressed="false" aria-controls="winDecisions">
        decisions <span id="queueCount" aria-label="decisions waiting on you">0</span>
      </button>
      <button class="dock-btn" id="btnRuns" type="button" aria-pressed="false" aria-controls="winRuns">missions</button>
      <button class="dock-btn mini" id="composerCollapse" type="button" aria-expanded="true"
              aria-controls="composerInput" aria-label="Collapse mission text" title="Collapse mission text">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div id="sceneZoom" role="group" aria-label="Scene zoom">
        <button id="sceneZoomOut" type="button" aria-label="Zoom scene out" title="Zoom scene out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M7 10h6"/></svg>
        </button>
        <output id="sceneZoomLevel" aria-live="polite">125%</output>
        <button id="sceneZoomIn" type="button" aria-label="Zoom scene in" title="Zoom scene in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M7 10h6M10 7v6"/></svg>
        </button>
      </div>
      <button class="dock-btn mini" id="btnAttach" type="button"
              aria-label="Attach a file" title="Attach a file — or just drop one on the window">+file</button>
    </div>

    <div id="mentionMenu" hidden role="listbox" aria-label="Completions"></div>
  </div>

  <script type="module" src="./ui/main.mjs"></script>
</body>
</html>
