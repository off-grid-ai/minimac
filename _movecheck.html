<!doctype html>
<meta charset="utf-8" />
<title>move check</title>
<style>html,body{margin:0;height:100%;background:#0b0e12}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/+esm';
import { createMoves } from './ui/moves.mjs';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight, false);
canvas.width = innerWidth; canvas.height = innerHeight;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0e12');
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(1.6, 4.2, 7.2);
camera.lookAt(0, 0.5, -0.8);
scene.add(new THREE.HemisphereLight('#8899aa', '#222833', 1.1));

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: '#2a2f38', roughness: 1 }),
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const colours = { accent: new THREE.Color('#34d399'), danger: new THREE.Color('#f87171') };
const moves = createMoves(scene, colours);

// Three stand-in desks: a desk slab at the spot, a body at the seat.
const spots = [{ x: -2.6, z: -0.6 }, { x: 0, z: -0.6 }, { x: 2.6, z: -0.6 }];
for (const s of spots) {
  const desk = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.38, 0.7), new THREE.MeshStandardMaterial({ color: '#3d434f' }));
  desk.position.set(s.x, 0.19, s.z);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.34, 6, 12), new THREE.MeshStandardMaterial({ color: '#8d93a0' }));
  body.position.set(s.x, 0.42, s.z - 0.66);
  scene.add(desk, body);
}

const ids = ['a', 'b', 'c'];
const spotOf = (id) => spots[ids.indexOf(id)] ?? null;
const ctx = { spotOf, agentOf: () => ({ diffLines: 60 }), colourOf: () => new THREE.Color('#7aa2ff') };

const LIFE = 900;
const plan = [
  { agentId: 'a', move: 'smash', tone: 'ok' },
  { agentId: 'b', move: 'smash', tone: 'fail' },
  { agentId: 'c', move: 'hex', tone: 'ok' },
];
let born = performance.now();
window.__restart = () => { born = performance.now(); };
window.__phase = 0;

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const age = window.__hold == null ? now - born : window.__hold * LIFE;
  const live = age < LIFE ? plan.map((m) => ({ ...m, born, life: 1 - age / LIFE })) : [];
  window.__phase = Math.min(age / LIFE, 1);
  moves.update(live, ctx, clock.getElapsedTime(), false);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
window.__errors = [];
addEventListener('error', (e) => window.__errors.push(String(e.message)));
</script>
